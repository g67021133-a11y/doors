<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOORS 6 — Downtown</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#101722;font-family:Arial}
canvas{display:block}
#ui{
 position:fixed;top:20px;left:22px;
 color:white;pointer-events:none;
 text-shadow:0 2px 8px black;
}
#ui h1{font-size:25px;letter-spacing:4px}
#ui span{color:#e8b75f}
#info{
 position:fixed;bottom:20px;left:20px;
 color:#ddd;font-size:12px;
 background:#101722aa;padding:12px;
 border:1px solid #ffffff22;
}
</style>
</head>
<body>

<div id="ui">
<h1>DOORS <span>6</span></h1>
<p>DOWNTOWN • LOST CITY</p>
</div>
<div id="info">DOWNTOWN DISTRICT | CITY ENVIRONMENT v0.1</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8799aa);
scene.fog=new THREE.FogExp2(0x8799aa,0.0018);

const camera=new THREE.PerspectiveCamera(
65,innerWidth/innerHeight,0.1,1000
);
camera.position.set(95,75,115);
camera.lookAt(0,15,0);

const renderer=new THREE.WebGLRenderer({
antialias:true
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

// LIGHTING
scene.add(new THREE.HemisphereLight(0xc9ddff,0x30333b,2));

const sun=new THREE.DirectionalLight(0xffe2b5,3);
sun.position.set(-100,160,80);
sun.castShadow=true;
sun.shadow.mapSize.set(4096,4096);
sun.shadow.camera.left=-180;
sun.shadow.camera.right=180;
sun.shadow.camera.top=180;
sun.shadow.camera.bottom=-180;
scene.add(sun);

// MATERIALS
function material(color,roughness=.7,metalness=.1){
return new THREE.MeshStandardMaterial({
color,roughness,metalness
});
}

const asphalt=material(0x252d37,.24,.35);
const concrete=material(0x777d83,.9);
const glass=material(0x38566c,.12,.85);
const darkGlass=material(0x172c40,.16,.8);
const white=material(0xc2c5c7);
const gold=material(0xb69a67,.4,.6);

// OBJECT CREATION
function cube(w,h,d,mat,x,y,z){
const mesh=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),mat
);
mesh.position.set(x,y,z);
mesh.castShadow=true;
mesh.receiveShadow=true;
scene.add(mesh);
return mesh;
}

// GROUND
cube(500,2,500,material(0x44494d),0,-2,0);

// ROADS
cube(500,.2,38,asphalt,0,-.8,0);
cube(38,.2,500,asphalt,0,-.8,0);

// ROAD MARKINGS
const lines=material(0xe1d4a8);
for(let i=-230;i<=230;i+=12){
cube(5,.04,.25,lines,i,-.68,0);
cube(.25,.04,5,lines,0,-.68,i);
}

// SIDEWALKS
for(let i=-1;i<=1;i+=2){
cube(500,.5,7,concrete,0,-.55,i*23);
cube(7,.5,500,concrete,i*23,-.55,0);
}

// BUILDINGS
let seed=12345;
function random(){
seed=(seed*1664525+1013904223)>>>0;
return seed/4294967296;
}

const facadeColors=[
0x667987,0x827f79,0x3b5263,
0x9a9b98,0x384b59,0x716c68
];

function building(x,z,w,d,h){
const color=facadeColors[
Math.floor(random()*facadeColors.length)
];
const body=cube(w,h,d,material(color,.65,.35),
x,h/2,z);

// Roof
cube(w+1,1,d+1,material(0x333b43),
x,h+.5,z);

// Roof equipment
for(let i=0;i<3;i++){
cube(2+random()*3,2+random()*3,
2+random()*3,material(0x50575c),
x+(random()-.5)*w*.6,
h+2,z+(random()-.5)*d*.6);
}

// Windows on front and back
for(let y=3;y<h-2;y+=3.5){
for(let xx=-w/2+2;xx<w/2-1;xx+=3){
const winMat=random()>.35?
glass:darkGlass;

cube(1.7,2,.12,winMat,
x+xx,y,z+d/2+.07);

cube(1.7,2,.12,winMat,
x+xx,y,z-d/2-.07);
}
}

// Side windows
for(let y=3;y<h-2;y+=3.5){
for(let zz=-d/2+2;zz<d/2-1;zz+=3){
cube(.12,2,1.7,glass,
x+w/2+.07,y,z+zz);
cube(.12,2,1.7,glass,
x-w/2-.07,y,z+zz);
}
}

// Decorative facade columns
for(let xx=-w/2;xx<=w/2;xx+=w/4){
cube(.25,h,.25,white,x+xx,h/2,z+d/2+.15);
}
}

// CITY GRID
for(let x=-125;x<=125;x+=48){
for(let z=-125;z<=125;z+=48){

if(Math.abs(x)<40||Math.abs(z)<40)continue;

let w=25+random()*13;
let d=25+random()*13;
let h=35+random()*100;

building(x+(random()-.5)*7,
z+(random()-.5)*7,w,d,h);
}
}

// MAIN TALL TOWERS
building(-65,-65,32,32,145);
building(65,-65,35,35,120);
building(-65,65,30,35,105);
building(65,65,38,30,155);

// PALM TREES
function palm(x,z){
const trunkMat=material(0x76563b);
const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(.45,.7,9,9),
trunkMat
);
trunk.position.set(x,4.5,z);
trunk.castShadow=true;
scene.add(trunk);

const leaves=material(0x245c3d);
for(let i=0;i<8;i++){
const angle=i*Math.PI/4;
const leaf=new THREE.Mesh(
new THREE.ConeGeometry(1.2,8,6),
leaves
);
leaf.position.set(
x+Math.sin(angle)*2,
8.5,
z+Math.cos(angle)*2
);
leaf.rotation.z=Math.cos(angle)*.8;
leaf.rotation.x=Math.sin(angle)*.8;
scene.add(leaf);
}
}

for(let i=-180;i<=180;i+=15){
palm(i,27);
palm(i,-27);
}

// STREET LIGHTS
for(let i=-180;i<=180;i+=25){
for(let side of [-1,1]){
const pole=cube(.25,8,.25,
material(0x30363a),i,4,side*30);

const lamp=new THREE.PointLight(0xffd29a,1.5,30);
lamp.position.set(i,8,side*30);
scene.add(lamp);

cube(1,.25,1,gold,i,8,side*30);
}
}

// FOUNTAIN PLAZA
cube(25,.8,25,concrete,0,.1,-85);
const water=new THREE.Mesh(
new THREE.CylinderGeometry(8,8,.6,48),
new THREE.MeshStandardMaterial({
color:0x2b819b,
roughness:.08,
metalness:.6
})
);
water.position.set(0,.8,-85);
scene.add(water);

const fountainLight=new THREE.PointLight(0x6bbce8,3,35);
fountainLight.position.set(0,5,-85);
scene.add(fountainLight);

// SKY DECORATION
const skyGeo=new THREE.SphereGeometry(450,32,32);
const skyMat=new THREE.MeshBasicMaterial({
color:0x839db7,side:THREE.BackSide
});
scene.add(new THREE.Mesh(skyGeo,skyMat));

// CAMERA ANIMATION
let angle=0;
function animate(){
requestAnimationFrame(animate);
angle+=.00035;
camera.position.x=95*Math.cos(angle);
camera.position.z=115*Math.sin(angle);
camera.lookAt(0,25,0);
renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
